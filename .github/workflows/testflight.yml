name: Deploy to TestFlight

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: macos-14
    steps:
      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "^16.0"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: xcodegen generate

      - name: Deploy to TestFlight via Fastlane
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          FASTLANE_HIDE_CHANGELOG: "true"
        run: |
          if [[ -z "$APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64" || -z "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" ]]; then
            echo "::error::Configure APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 and APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD repository secrets with a persistent Apple Distribution signing identity."
            exit 1
          fi

          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          export CI_KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          export APPLE_DISTRIBUTION_CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          trap 'rm -f "$APPLE_DISTRIBUTION_CERTIFICATE_PATH"' EXIT
          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64" | openssl base64 -d -A > "$APPLE_DISTRIBUTION_CERTIFICATE_PATH"
          test -s "$APPLE_DISTRIBUTION_CERTIFICATE_PATH"

          mkdir -p fastlane
          cat << 'EOF' > fastlane/Fastfile
          default_platform(:ios)

          platform :ios do
            desc "Build and upload to TestFlight"
            lane :beta do
              # Create and unlock a temporary keychain for code signing
              create_keychain(
                name: "ci_keychain",
                password: ENV["CI_KEYCHAIN_PASSWORD"],
                default_keychain: true,
                unlock: true,
                timeout: 3600,
                lock_when_sleeps: false
              )

              import_certificate(
                certificate_path: ENV["APPLE_DISTRIBUTION_CERTIFICATE_PATH"],
                certificate_password: ENV["APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD"],
                keychain_path: File.expand_path("~/Library/Keychains/ci_keychain-db"),
                keychain_password: ENV["CI_KEYCHAIN_PASSWORD"]
              )

              api_key = app_store_connect_api_key(
                key_id: ENV["APP_STORE_CONNECT_KEY_ID"],
                issuer_id: ENV["APP_STORE_CONNECT_ISSUER_ID"],
                key_filepath: "~/.appstoreconnect/private_keys/AuthKey_#{ENV['APP_STORE_CONNECT_KEY_ID']}.p8",
                in_house: false
              )

              # Generate and download the App Store distribution profile
              get_provisioning_profile(
                api_key: api_key,
                app_identifier: "com.tannerjohnson.toddlertrains"
              )

              profile_name = lane_context[SharedValues::SIGH_NAME]

              # Build and archive
              build_app(
                project: "ToddlerTrains.xcodeproj",
                scheme: "ToddlerTrains",
                export_method: "app-store",
                xcargs: "PROVISIONING_PROFILE_SPECIFIER='#{profile_name}'",
                export_options: {
                  signingStyle: "manual",
                  teamID: ENV["APPLE_TEAM_ID"],
                  provisioningProfiles: {
                    "com.tannerjohnson.toddlertrains" => profile_name
                  }
                }
              )

              # Upload binary
              upload_to_testflight(
                api_key: api_key,
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOF

          fastlane ios beta --verbose
