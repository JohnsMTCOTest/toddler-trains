name: Deploy to TestFlight

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: macos-15
    steps:
      - name: Select Latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Required App Icons
        run: |
          mkdir -p ToddlerTrains/Assets.xcassets/AppIcon.appiconset

          python3 -c "
          import struct, zlib

          def create_png(width, height, color):
              raw_data = b''.join([b'\x00' + color * width for _ in range(height)])
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw_data)) + chunk(b'IEND', b'')

          with open('base_icon.png', 'wb') as f:
              f.write(create_png(1024, 1024, b'\x1E\x90\xFF'))
          "

          sips -z 120 120 base_icon.png --out ToddlerTrains/Assets.xcassets/AppIcon.appiconset/icon_120.png
          sips -z 152 152 base_icon.png --out ToddlerTrains/Assets.xcassets/AppIcon.appiconset/icon_152.png
          sips -z 167 167 base_icon.png --out ToddlerTrains/Assets.xcassets/AppIcon.appiconset/icon_167.png
          sips -z 180 180 base_icon.png --out ToddlerTrains/Assets.xcassets/AppIcon.appiconset/icon_180.png
          sips -z 1024 1024 base_icon.png --out ToddlerTrains/Assets.xcassets/AppIcon.appiconset/icon_1024.png

          cat << 'EOF' > ToddlerTrains/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "size" : "60x60",
                "idiom" : "iphone",
                "filename" : "icon_120.png",
                "scale" : "2x"
              },
              {
                "size" : "60x60",
                "idiom" : "iphone",
                "filename" : "icon_180.png",
                "scale" : "3x"
              },
              {
                "size" : "76x76",
                "idiom" : "ipad",
                "filename" : "icon_152.png",
                "scale" : "2x"
              },
              {
                "size" : "83.5x83.5",
                "idiom" : "ipad",
                "filename" : "icon_167.png",
                "scale" : "2x"
              },
              {
                "size" : "1024x1024",
                "idiom" : "ios-marketing",
                "filename" : "icon_1024.png",
                "scale" : "1x"
              }
            ],
            "info" : {
              "version" : 1,
              "author" : "xcode"
            }
          }
          EOF

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: xcodegen generate

      - name: Deploy to TestFlight via Fastlane
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          FASTLANE_HIDE_CHANGELOG: "true"
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          mkdir -p fastlane
          cat << 'EOF' > fastlane/Fastfile
          default_platform(:ios)

          platform :ios do
            desc "Build and upload to TestFlight"
            lane :beta do
              keychain_name = "ci_keychain"
              keychain_password = "temporary_ci_password"

              create_keychain(
                name: keychain_name,
                password: keychain_password,
                default_keychain: true,
                unlock: true,
                timeout: 3600,
                lock_when_sleeps: false
              )

              api_key = app_store_connect_api_key(
                key_id: ENV["APP_STORE_CONNECT_KEY_ID"],
                issuer_id: ENV["APP_STORE_CONNECT_ISSUER_ID"],
                key_filepath: "~/.appstoreconnect/private_keys/AuthKey_#{ENV['APP_STORE_CONNECT_KEY_ID']}.p8",
                in_house: false
              )

              get_certificates(
                api_key: api_key,
                keychain_path: File.expand_path("~/Library/Keychains/#{keychain_name}-db"),
                keychain_password: keychain_password
              )

              get_provisioning_profile(
                api_key: api_key,
                app_identifier: "com.tannerjohnson.toddlertrains"
              )

              profile_name = lane_context[SharedValues::SIGH_NAME]

              update_code_signing_settings(
                path: "ToddlerTrains.xcodeproj",
                use_automatic_signing: false,
                team_id: ENV["APPLE_TEAM_ID"],
                code_sign_identity: "Apple Distribution",
                profile_name: profile_name,
                bundle_identifier: "com.tannerjohnson.toddlertrains"
              )

              build_app(
                project: "ToddlerTrains.xcodeproj",
                scheme: "ToddlerTrains",
                export_method: "app-store",
                export_options: {
                  signingStyle: "manual",
                  teamID: ENV["APPLE_TEAM_ID"],
                  provisioningProfiles: {
                    "com.tannerjohnson.toddlertrains" => profile_name
                  }
                }
              )

              upload_to_testflight(
                api_key: api_key,
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOF

          fastlane ios beta --verbose
