name: Deploy to TestFlight

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer
    steps:
      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        run: brew install xcodegen

      - name: Generate Xcode Project
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: xcodegen generate

      - name: Install App Store Connect Private Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Archive and Export App
        run: |
          xcodebuild -project ToddlerTrains.xcodeproj \
            -scheme ToddlerTrains \
            -destination "generic/platform=iOS" \
            -archivePath build/ToddlerTrains.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p build/Payload
          cp -r build/ToddlerTrains.xcarchive/Products/Applications/ToddlerTrains.app build/Payload/
          cd build && zip -r ToddlerTrains.ipa Payload

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            -f build/ToddlerTrains.ipa \
            -t ios \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
