name: ToddlerTrains
options:
  bundleIdPrefix: com.tannerjohnson
  xcodeVersion: "16.0"
targets:
  ToddlerTrains:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ToddlerTrains
    info:
      path: ToddlerTrains/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.tannerjohnson.toddlertrains
      DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
      CODE_SIGN_STYLE: Manual
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
